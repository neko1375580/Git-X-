<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Git X — ИИ-Органайзер Разработчика</title>
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#09090b" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-[#09090b] text-[#f4f4f5] antialiased selection:bg-indigo-500/30 selection:text-indigo-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      const isDev = window.location.hostname === 'localhost' || 
                    window.location.hostname === '127.0.0.1' || 
                    window.location.hostname.includes('ais-dev-') ||
                    window.location.port !== '';

      if (isDev) {
        console.log('Development mode detected. Disabling service worker and clearing cache...');
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(registrations => {
            for (let registration of registrations) {
              registration.unregister().then(() => {
                console.log('Service Worker unregistered to prevent stale cache in development');
              });
            }
          });
        }
        if ('caches' in window) {
          caches.keys().then(keys => {
            for (let key of keys) {
              caches.delete(key);
            }
            console.log('Caches cleared successfully');
          });
        }
      } else {
        if ('serviceWorker' in navigator) {
          window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js')
              .then(reg => console.log('ServiceWorker registered:', reg.scope))
              .catch(err => console.error('ServiceWorker registration failed:', err));
          });
        }
      }
    </script>
  </body>
</html>
